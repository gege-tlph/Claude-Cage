name: Cage lite release
# Builds, signs and publishes the Windows release of the current VERSION from
# main. Owned by Cage lite; the upstream workflows stay disabled here.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after the signed build passes (off keeps the signed files as a workflow artifact)
        type: boolean
        default: true
      reuse_run:
        description: Publish the signed files of an earlier run of this workflow (its run ID) instead of building again
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: cage-lite-release
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'gege-tlph/Claude-Cage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      # The commit the tag names; its sources are the ones that were built.
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # A reused build must be an ancestor of this main commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Version, release notes, an unused tag and the pinned certificate
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          node scripts/check-version.mjs
          node --test scripts/windows-publisher-trust.test.mjs
          version=$(tr -d '[:space:]' < VERSION)
          test -s "docs/releases/v$version.md" || { echo "::error::docs/releases/v$version.md is missing"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists; raise VERSION"; exit 1
          fi
          sha=$GITHUB_SHA
          if [ -n "$REUSE_RUN" ]; then
            # Only a run of this workflow whose signed build passed, built from
            # a commit with the same VERSION.
            [[ $REUSE_RUN =~ ^[0-9]+$ ]] || { echo "::error::reuse_run must be a run ID"; exit 1; }
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN")
            [ "$(jq -r .path <<<"$run")" = .github/workflows/cage-lite-release.yml ] || { echo "::error::Run $REUSE_RUN is not a Cage lite release run"; exit 1; }
            built=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN/jobs" --jq '.jobs[] | select(.name == "windows") | .conclusion')
            [ "$built" = success ] || { echo "::error::The signed build of run $REUSE_RUN did not pass"; exit 1; }
            sha=$(jq -r .head_sha <<<"$run")
            reused=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$sha" --jq .content | base64 -d | tr -d '[:space:]')
            [ "$reused" = "$version" ] || { echo "::error::Run $REUSE_RUN built $reused, not $version"; exit 1; }
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA" || { echo "::error::$sha is not on main"; exit 1; }
            # The tag is made on this run's commit: the workflow token may not
            # create a ref whose workflow files differ from main. Only the
            # CI configuration may differ from the commit that was built.
            git diff --quiet "$sha" "$GITHUB_SHA" -- . ':(exclude).github' || { echo "::error::Sources changed since run $REUSE_RUN built $sha"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  windows:
    needs: check
    if: inputs.reuse_run == ''
    runs-on: windows-2025
    environment: cage-release
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/windows-toolchain
        with:
          corresponding-sources: true
          setup-caches: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Trust the Cage lite publisher on this runner
        # The release certificate is self-signed; signing checks need a trusted
        # chain. Only this disposable runner's machine store changes.
        run: Import-Certificate -FilePath packaging/windows/cage-lite-signing.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
      - name: Build, sign, test and install the release
        env:
          CAGE_BUILD_REF: ${{ github.sha }}
          CAGE_WINDOWS_SIGNING_PROVIDER: certificate-store
          CAGE_WINDOWS_PFX_BASE64: ${{ secrets.CAGE_WINDOWS_PFX_BASE64 }}
          CAGE_WINDOWS_PFX_PASSWORD: ${{ secrets.CAGE_WINDOWS_PFX_PASSWORD }}
        run: ./scripts/ci-windows-build.ps1 -Release
      - name: The installer carries the certificate in this repository
        run: |
          $version = '${{ needs.check.outputs.version }}'
          $installer = "_output/releases/$version/windows/Cage-$version-windows-amd64-setup.exe"
          $expected = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path packaging/windows/cage-lite-signing.cer).Path)
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or $signature.SignerCertificate.Thumbprint -ne $expected.Thumbprint) {
            throw "The installer is not signed by the Cage lite certificate: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          if ((Get-Item -LiteralPath $installer).Length -gt 512MB) { throw 'The installer exceeds the in-app updater limit.' }
      - uses: actions/upload-artifact@v4
        with:
          name: cage-lite-release-windows
          path: |
            _output/releases/*/windows/Cage-*-windows-amd64-setup.exe
            _output/releases/*/windows/SHA256SUMS
            _output/releases/*/windows/mihomo-*-source.tar.gz
            _output/releases/*/windows/qemu-*-source.tar.gz
            _output/releases/*/windows/qemu-*-windows-full-source.*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Preserve the acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cage-lite-release-windows-reports
          path: |
            ${{ runner.temp }}/cage-smoke-*.json
            ${{ runner.temp }}/cage-build-ui-*/smoke.json
            ${{ runner.temp }}/cage-build-ui-*/*.png
          if-no-files-found: ignore
          retention-days: 14
  publish:
    needs: [check, windows]
    # The build ran and passed here, or is reused from a checked earlier run.
    if: ${{ !cancelled() && inputs.publish && needs.check.result == 'success' && (needs.windows.result == 'success' || (needs.windows.result == 'skipped' && inputs.reuse_run != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cage-lite-release-windows
          path: ${{ runner.temp }}/release-artifact
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble and verify the release files
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Outside the checkout: the repository has its own assets/ folder.
          files="$RUNNER_TEMP/release-files"
          mkdir "$files"
          find "$RUNNER_TEMP/release-artifact" -type f -exec cp {} "$files/" \;
          cp packaging/windows/cage-lite-signing.cer "$files/"
          cd "$files"
          test -f "Cage-$VERSION-windows-amd64-setup.exe"
          sha256sum -c SHA256SUMS
          sha256sum cage-lite-signing.cer >> SHA256SUMS
          # In-app updates read this release from github.com, not the API with
          # its 60 requests an hour per address. Written once SHA256SUMS is final.
          node "$GITHUB_WORKSPACE/scripts/release-manifest.mjs" "$files" "$VERSION" "$GITHUB_REPOSITORY"
          ls -l
      - name: Draft, check the uploaded files, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          TARGET_SHA: ${{ needs.check.outputs.sha }}
        run: |
          tag="v$VERSION"
          files="$RUNNER_TEMP/release-files"
          # This run's main commit; the check job confirmed its sources are the ones built.
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --draft \
            --title "Cage lite $VERSION" --notes-file "docs/releases/$tag.md" "$files"/*
          check="$RUNNER_TEMP/release-check"
          mkdir "$check"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$check"
          (cd "$check" && sha256sum -c "$files/SHA256SUMS")
          cmp "$check/cage-lite-release.json" "$files/cage-lite-release.json"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"
