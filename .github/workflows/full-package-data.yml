name: Full package installation data
# The full package carries what a first start downloads. The data is
# collected from a real online installation of this build's environment, on
# a Linux runner with KVM (Windows runners have no nested virtualization),
# then the Windows release packs it beside the signed program files.
on:
  workflow_call:
    inputs:
      ref:
        description: Exact 40-character commit SHA to build
        required: true
        type: string
      artifact_name:
        description: Name of the data artifact
        required: true
        type: string
  # Trial runs while the full package is developed; no release.
  push:
    branches: [feat/full-package]
permissions:
  contents: read
concurrency:
  group: full-package-data-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Room for the environment
        # The base and the environment disks, the collected files and the
        # data need about 15 GB; the runner's unused toolchains free more.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils openssh-client openssh-sftp-server
          test -r /dev/kvm -a -w /dev/kvm
          qemu-system-x86_64 --version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The UI build prepares noVNC with uv.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build cage and cage-offline-data
        run: |
          version=$(tr -d '\r\n' < VERSION)
          bash scripts/fetch-linux-proxy-core.sh
          make cage GOOS=linux GOARCH=amd64 CGO_ENABLED=0 VERSION="$version"
          mkdir -p "$RUNNER_TEMP/app"
          install -m 755 _output/bin/cage _output/linux-deps/mihomo "$RUNNER_TEMP/app/"
          go build -o "$RUNNER_TEMP/cage-offline-data" ./cmd/cage-offline-data
          "$RUNNER_TEMP/app/cage" help > /dev/null
      - name: Proxy exit in its own network namespace
        # Cage takes no address of this host as a node; the namespace's is
        # not one. Its traffic leaves through the runner's network.
        run: |
          sudo ip netns add cage-exit
          sudo ip link add cage-exit0 type veth peer name cage-exit1
          sudo ip link set cage-exit1 netns cage-exit
          sudo ip addr add 10.200.0.1/24 dev cage-exit0
          sudo ip link set cage-exit0 up
          sudo ip netns exec cage-exit ip addr add 10.200.0.2/24 dev cage-exit1
          sudo ip netns exec cage-exit ip link set cage-exit1 up
          sudo ip netns exec cage-exit ip link set lo up
          sudo ip netns exec cage-exit ip route add default via 10.200.0.1
          sudo sysctl -q -w net.ipv4.ip_forward=1
          sudo iptables -t nat -A POSTROUTING -s 10.200.0.0/24 ! -o cage-exit0 -j MASQUERADE
          sudo iptables -I FORWARD -s 10.200.0.0/24 -j ACCEPT
          sudo iptables -I FORWARD -d 10.200.0.0/24 -j ACCEPT
          sudo mkdir -p /etc/netns/cage-exit
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/cage-exit/resolv.conf > /dev/null
          sudo ip netns exec cage-exit python3 -I scripts/offline-data-exit-proxy.py --port 1080 > "$RUNNER_TEMP/exit-proxy.log" 2>&1 &
          for _ in $(seq 1 20); do grep -q listening "$RUNNER_TEMP/exit-proxy.log" && break; sleep 0.5; done
          curl -fsS -o /dev/null --socks5-hostname 10.200.0.2:1080 https://deb.debian.org/debian/dists/trixie/InRelease
      - name: Install online and collect the data
        # A short profile path: Lima's sockets live under it. The host's own
        # downloads (the Debian image) read HTTPS_PROXY before the desktop's
        # proxy settings, which a runner cannot report; they use the exit too.
        env:
          HTTP_PROXY: socks5://10.200.0.2:1080
          HTTPS_PROXY: socks5://10.200.0.2:1080
          NO_PROXY: localhost,127.0.0.1
        run: |
          bash scripts/build-offline-data.sh "$RUNNER_TEMP/app/cage" "$RUNNER_TEMP/cage-offline-data" 10.200.0.2:1080 \
            /tmp/cfp "$RUNNER_TEMP/data/offline"
          du -sh "$RUNNER_TEMP/data/offline" "$RUNNER_TEMP/data/offline"/*
          wc -l "$RUNNER_TEMP/data/offline.packages.tsv"
      - name: What the installation reached
        if: always()
        run: |
          awk '$2 == "done" || $2 == "fail" { split($3, t, ":"); n[$2 " " t[1]]++ } END { for (k in n) print n[k], k }' "$RUNNER_TEMP/exit-proxy.log" | sort -k2 || true
          cp "$RUNNER_TEMP/exit-proxy.log" "$RUNNER_TEMP/data/" 2>/dev/null || true
      - name: Diagnostics of a failed installation
        if: failure()
        run: |
          "$RUNNER_TEMP/app/cage" agent diagnostics --config /tmp/cfp/profile/config.json --output "$RUNNER_TEMP/diagnostics.zip" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-package-data-diagnostics
          path: ${{ runner.temp }}/diagnostics.zip
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'full-package-data' }}
          path: ${{ runner.temp }}/data
          if-no-files-found: error
          retention-days: 14
